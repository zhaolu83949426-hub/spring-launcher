[package]
name = "spring-launcher"
version = "0.1.0"
description = "Spring Cloud 本地服务启动管理器"
authors = ["csgc"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "spring_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 目录遍历（比 std::fs 递归方便）
walkdir = "2.5"
# 唯一 id 生成
uuid = { version = "1.11", features = ["v4"] }
# 日志
log = "0.4"
env_logger = "0.11"
# 目录定位（APPDATA 等）
dirs = "5"
# pom.xml 结构化解析（判定可运行的 Spring Boot 模块）
# 0.41 已作为 plist→tauri 传递依赖存在于 Cargo.lock，此处显式声明以便直接使用
quick-xml = "0.41"
# 伪终端（Windows ConPTY / Unix ptys）——内嵌交互式终端用
portable-pty = "0.8"
